<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Traitors of Hove</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Traitors of Hove</h1>
    <nav id="nav" hidden>
      <button data-tab="game" class="active">Game</button>
      <button data-tab="videos">Videos</button>
    </nav>
  </header>

  <main id="app"><p class="muted">Loading…</p></main>

  <!-- floating "hold to see my role" button, shown once roles exist -->
  <button id="peek" hidden>Hold to see my role</button>

  <div id="roleCard" class="overlay" hidden></div>
  <div id="roulette" class="overlay" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    // On localhost / a LAN address, use the throwaway test project; on the live site, the real one.
    var local = location.hostname === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname);
    document.write('<script src="' + (local ? 'config.test.js' : 'config.js') + '?' + Date.now() + '"><\/script>');
  </script>
  <script src="app.js"></script>
</body>
</html>
